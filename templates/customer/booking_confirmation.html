<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking Confirmed | SafeTravels</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body>
    <header>
      <nav class="site-nav">
        <div class="container">
          <a class="brand" href="/">Safe<span>Travels</span> </a>
        </div>
      </nav>
    </header>
    <main class="container section-space pt-5">
      <div class="content-card mx-auto text-center" style="max-width: 700px">
        <div class="feature-icon rounded-circle">
          <i class="bi bi-check-lg"> </i>
        </div>
        <h1 class="section-title">Booking Confirmed</h1>
        <p class="text-muted">
          Your demo booking has been recorded in this static interface.
        </p>
        <div class="row text-start border-top border-bottom py-3 my-4">
          <div class="col-6 col-md-4">
            <small class="text-muted">PNR</small>
            <strong class="d-block">ST8K2P</strong>
          </div>
          <div class="col-6 col-md-4">
            <small class="text-muted">Passenger</small>
            <strong class="d-block">Demo Passenger</strong>
          </div>
          <div class="col-6 col-md-4 mt-3 mt-md-0">
            <small class="text-muted">Status</small>
            <strong class="d-block text-success">Confirmed</strong>
          </div>
          <div class="col-6 col-md-4 mt-3">
            <small class="text-muted">Flight</small>
            <strong class="d-block">AI-123</strong>
          </div>
          <div class="col-6 col-md-4 mt-3">
            <small class="text-muted">Route</small>
            <strong class="d-block">Mumbai → Delhi</strong>
          </div>
          <div class="col-6 col-md-4 mt-3">
            <small class="text-muted">Seat / Amount</small>
            <strong class="d-block">3C · ₹5,750</strong>
          </div>
        </div>
        <a class="btn btn-primary" href="/boardingpass"
          >View Boarding Pass</a
        >
        <a class="btn btn-outline-primary ms-2" href="/mybookings"
          >My Bookings</a
        >
        <button class="btn btn-light ms-2" type="button">
          Download Ticket (Demo)
        </button>
      </div>
    </main>
  </body>
</html>
