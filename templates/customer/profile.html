<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | SafeTravels</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><nav class="site-nav"><div class="container d-flex justify-content-between"><a class="brand" href="{{ url_for('home') }}">Safe<span>Travels</span></a><a href="{{ url_for('my_book') }}">My bookings</a></div></nav><main class="container section-space pt-5"><div class="row justify-content-center"><div class="col-lg-7"><form class="content-card" method="post"><h1 class="section-title">My profile</h1><label class="form-label mt-3">Name</label><input class="form-control" name="name" value="{{ user.full_name }}" required><label class="form-label mt-3">Email</label><input class="form-control" name="email" type="email" value="{{ user.email }}" required><label class="form-label mt-3">Mobile</label><input class="form-control" name="mobile" value="{{ user.mobile }}" required><button class="btn btn-primary mt-4">Save changes</button><a class="btn btn-outline-primary mt-4 ms-2" href="{{ url_for('logout') }}">Logout</a></form></div></div></main></body></html>
