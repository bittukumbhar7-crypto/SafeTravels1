<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | SafeTravels</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body>
    <header>
      <nav class="site-nav">
        <div class="container d-flex justify-content-between">
          <a class="brand" href="/">Safe<span>Travels</span> </a>
          <a class="nav-link" href="/mybookings">My Bookings</a>
        </div>
      </nav>
    </header>
    <main class="container section-space pt-5">
      <h1 class="section-title">My profile</h1>
      <div class="row mt-3">
        <div class="col-lg-8">
          <div class="content-card mb-4">
            <h4>Personal Information</h4>
            <div class="row g-3 mt-1">
              <div class="col-md-6">
                <label class="form-label">Name</label>
                <input class="form-control" value="Demo Traveller" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Mobile</label>
                <input class="form-control" value="+91 98765 43210" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input class="form-control" value="demo@safetravels.test" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Date of Birth</label>
                <input class="form-control" type="date" />
              </div>
            </div>
            <button class="btn btn-primary mt-4">Save Changes</button>
          </div>
          <div class="content-card">
            <h4>Travel Preferences</h4>
            <label class="form-label mt-3">Preferred Class</label>
            <select class="form-select">
              <option>Economy</option>
              <option>Business</option>
            </select>
            <label class="form-label mt-3">Preferred Airport</label>
            <select class="form-select">
              <option>Mumbai (BOM)</option>
            </select>
          </div>
        </div>
        <div class="col-lg-4 mt-4 mt-lg-0">
          <div class="content-card">
            <h4>Account Actions</h4>
            <a
              class="btn btn-outline-primary w-100 mt-3"
              href="my_bookings.html"
              >View My Bookings</a
            >
            <a class="btn btn-outline-primary w-100 mt-2" href="login.html"
              >Logout (Demo)</a
            >
            <p class="demo-note mt-3 mb-0">
              Profile data is a static frontend placeholder.
            </p>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
