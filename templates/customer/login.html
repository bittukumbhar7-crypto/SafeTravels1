<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | SafeTravels</title>
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro/dist/css/coreui.min.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  </head>
  <body class="auth-page">
    <main class="container">
      <form class="auth-card" action="/login" method="post">
        <a class="brand d-block text-center mb-4" href="/"
          >Safe<span>Travels</span>
        </a>
        <h2 class="text-center h3">Welcome back</h2>
        <p class="text-muted text-center mb-4">
          Log in to manage travel plans or the administration portal.
        </p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} py-2" role="alert">{{ message }}</div>
          {% endfor %}
        {% endwith %}
        <label class="form-label">Email</label>
        <input
          class="form-control mb-3"
          type="email"
          placeholder="you@example.com"
          name="txtemail"
          required
        />
        <div class="mb-3">
          <label for="examplePasswordInput1" class="form-label">Password</label>
          <div class="form-password">
              <input type="password" class="form-control" id="examplePasswordInput1" name="txtpassword" placeholder="Enter your password">
                <button type="button" class="form-password-action" data-coreui-toggle="password" aria-pressed="false" aria-label="Toggle password visibility">
                    <span class="form-password-action-icon"></span>
                </button>
          </div>
        </div>
            <script src="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro/dist/js/coreui.bundle.min.js"></script>
        <div class="text-end mb-4">
          <a href="#">Forgot Password?</a>
        </div>  
        <button class="btn btn-primary w-100">Login</button>
        <hr>
        <p class="text-center mt-4 mb-0">
          New to SafeTravels? <a href="/signup">Create Account</a>
        </p>
      </form>
    </main>
  </body>
</html>
