<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Flights | SafeTravels</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body>
    <header>
      <nav class="site-nav">
        <div class="container d-flex justify-content-between">
          <a class="brand" href="/">Safe<span>Travels</span> </a>
          <div class="nav">
            <a class="nav-link" href="/">Home</a>
            <a class="nav-link" href="/mybookings">My Bookings</a>
            <a class="nav-link" href="/profile">Profile</a>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <section class="page-header">
        <div class="container">
          <h1>Find your flight</h1>
          <p class="mb-0 text-muted">
            Search and filter demo flights for your next trip.
          </p>
        </div>
      </section>
      <section class="section-space pt-4">
        <div class="container">
          <form class="content-card mb-4" action="/searchflights" method="POST">
            <div class="row g-3">
              <div class="col-12 col-sm-6 col-lg-3">
                <label class="form-label">From</label>

                <input
                  type="text"
                  class="form-control"
                  name="source_city"
                  list="sourceCities"
                  placeholder="Enter source city"
                />

                <datalist id="sourceCities">
                  <option value="Mumbai"></option>
                  <option value="Delhi"></option>
                  <option value="Bangalore"></option>
                  <option value="Hyderabad"></option>
                  <option value="Chennai"></option>
                  <option value="Kolkata"></option>
                  <option value="Ahmedabad"></option>
                  <option value="Lucknow"></option>
                  <option value="Pune"></option>
                  <option value="Jaipur"></option>
                  <option value="Goa"></option>
                </datalist>
              </div>
              <div class="col-12 col-sm-6 col-lg-3">
                <label class="form-label">To</label>

                <input
                  type="text"
                  class="form-control"
                  name="destination_city"
                  list="destinationCities"
                  placeholder="Enter destination city"
                />

                <datalist id="destinationCities">
                  <option value="Mumbai"></option>
                  <option value="Delhi"></option>
                  <option value="Bangalore"></option>
                  <option value="Hyderabad"></option>
                  <option value="Chennai"></option>
                  <option value="Kolkata"></option>
                  <option value="Ahmedabad"></option>
                  <option value="Lucknow"></option>
                  <option value="Pune"></option>
                  <option value="Jaipur"></option>
                  <option value="Goa"></option>
                </datalist>
              </div>
              <div class="col-12 col-sm-6 col-lg-3">
                <label class="form-label">Departure Date</label>
                <input class="form-control" type="date" name="departure_date"/>
              </div>
              <div class="col-12 col-sm-6 col-lg-3">
                <label class="form-label">Return Date(Optional)</label>
                <input class="form-control" type="date" name="return_date" />
              </div>
              <div class="col-12 col-sm-6 col-lg-3">
                <label class="form-label">Travellers</label>
                <input
                  type="number"
                  class="form-control"
                  name="travellers"
                  placeholder="Enter number of travellers"
                  min="1"
                  max="9"
                />
              </div>
              <div class="col-12 col-sm-6 col-lg-3">
                <label class="form-label">Class</label>
                <select class="form-select" name="travel_class">
                  <option value="Economy">Economy</option>
                  <option value="Business">Business</option>
                </select>
              </div>
              <div class="col-12 col-sm-6 col-lg-3">
                <label class="form-label">Stops</label>
                <select class="form-select" name="stops">
                  <option value="Any">Any stops</option>
                  <option value="Non-stop">Non-stop</option>
                  <option value="1">Up to 1 stop</option>
                  <option value="2">Up to 2 stops</option>
                </select>
              </div>
              <div class="col-12 col-sm-6 col-lg-3 d-flex align-items-end">
                <button class="btn btn-primary w-100">Search Flights</button>
              </div>
            </div>
          </form>
          <div class="row">
            <aside class="col-md-3">
              <div class="content-card">
                <h5>Filters</h5>
                <label class="form-label mt-3">Airline</label>
                <select class="form-select mb-3">
                  <option>All airlines</option>
                  <option>Air India</option>
                  <option>IndiGo</option>
                </select>
                <label class="form-label">Departure Time</label>
                <select class="form-select mb-3">
                  <option>Any time</option>
                  <option>Morning</option>
                  <option>Evening</option>
                </select>
                <label class="form-label">Arrival Time</label>
                <select class="form-select mb-3">
                  <option>Any time</option>
                  <option>Afternoon</option>
                </select>
                <label class="form-label">Price Range</label>
                <select class="form-select">
                  <option>Any price</option>
                  <option>Under ₹6,000</option>
                </select>
              </div>
            </aside>
            <div class="col-md-9 mt-4 mt-md-0">
              <div class="content-card" id="prediction">
                <span class="text-primary fw-bold">DEMO INTERFACE</span>
                <h3 class="mt-2">Predict Your Flight Price</h3>
                <p class="text-muted">
                  This UI will connect to your machine-learning model later.
                </p>
                <div class="row g-3">
                  <div class="col-md-6">
                    <select class="form-select">
                      <option>Air India</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <select class="form-select">
                      <option>0 Stops</option>
                    </select>
                  </div>
                  <div class="col-md-6">
                    <input
                      class="form-control"
                      type="text"
                      placeholder="Duration e.g. 2h 15m"
                    />
                  </div>
                  <div class="col-md-6">
                    <input
                      class="form-control"
                      type="number"
                      placeholder="Days left to travel"
                    />
                  </div>
                </div>
                <div class="alert alert-warning mt-3 mb-0">
                  Prediction result will appear here after the ML model is
                  connected.
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
