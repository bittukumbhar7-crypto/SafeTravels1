<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | SafeTravels</title>
    <link href="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro/dist/css/coreui.min.css" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro/dist/css/coreui.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body class="auth-page">
    <main class="container">
      <form class="auth-card" action="/signup" method="post">
        <a class="brand d-block text-center mb-4" href="/"
          >Safe<span>Travels</span>
        </a>
        <h2 class="text-center h3">Create your account</h2>
        <p class="text-muted text-center mb-4">
          Start planning your next journey.
        </p>
        <label class="form-label">Full Name</label>
        <input class="form-control mb-3" type="text" name="txtname" required />
        <label class="form-label">Email</label>
        <input
          class="form-control mb-3"
          type="email"
          name="txtemail"
          required
        />
        <label class="form-label">Mobile Number</label>
        <input class="form-control mb-3" type="tel" name="txtmob" required />
        <div class="mb-3">
          <label for="examplePasswordInput1" class="form-label">Password</label>
          <div class="form-password">
            <input
              type="password"
              class="form-control mb-3"
              id="examplePasswordInput1"
              placeholder="Enter your password"
              name="txtpassword"
              required
            />
            <button
              type="button"
              class="form-password-action"
              data-coreui-toggle="password"
              aria-pressed="false"
              aria-label="Toggle password visibility"
            >
              <span class="form-password-action-icon"></span>
            </button>
          </div>
        </div>
        <div class="mb-3">
          <label for="examplePasswordInput1" class="form-label">Confirm Password</label>
          <div class="form-password">
            <input
              type="password"
              class="form-control mb-3"
              id="examplePasswordInput1"
              placeholder="Enter your password"
              name="txtconfirm"
              required
            />
            <button
              type="button"
              class="form-password-action"
              data-coreui-toggle="password"
              aria-pressed="false"
              aria-label="Toggle password visibility"
            >
              <span class="form-password-action-icon"></span>
            </button>
          </div>
          
        <font color="red"> {{message}}</font>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/@coreui/coreui-pro/dist/js/coreui.bundle.min.js"></script>
        <button class="btn btn-primary w-100">Create Account</button>
        <p class="text-center mt-4 mb-0">
          Already have an account? <a href="/login">Login</a>
        </p>
      </form>
    </main>
  </body>
</html>
