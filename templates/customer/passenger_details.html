<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passenger Details | SafeTravels</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head><body><nav class="site-nav"><div class="container"><a class="brand" href="{{ url_for('home') }}">Safe<span>Travels</span></a></div></nav><main class="container section-space pt-5"><div class="row justify-content-center"><div class="col-lg-8"><form class="content-card" method="post" action="{{ url_for('con_pay') }}"><input type="hidden" name="flight_id" value="{{ selected_flight.flight_id }}">{% for seat in selected_seats %}<input type="hidden" name="seat_number" value="{{ seat }}">{% endfor %}<h1 class="section-title">Passenger details</h1><p class="text-muted">These details are protected in the database and not shown in URLs.</p>{% if error_message %}<div class="alert alert-danger">{{ error_message }}</div>{% endif %}{% for i in range(travellers) %}<h5 class="mt-4">Passenger {{ i+1 }} · Seat {{ selected_seats[i] }}</h5><div class="row g-3"><div class="col-md-8"><label class="form-label">Passenger name</label><input class="form-control" name="passenger_name[]" value="{{ form_data.get('passenger_name[]', [''] * travellers)[i] }}" required></div><div class="col-md-4"><label class="form-label">Age</label><input class="form-control" name="age[]" type="number" min="1" max="120" value="{{ form_data.get('age[]', [''] * travellers)[i] }}" required></div><div class="col-md-4"><label class="form-label">Gender</label><select class="form-select" name="gender[]" required><option value="">Choose</option>{% for item in ['Female','Male','Other'] %}<option {% if form_data.get('gender[]', [''] * travellers)[i] == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">ID type</label><select class="form-select" name="id_type[]" required><option value="">Choose</option>{% for item in ['Aadhaar Card','Passport','Driving License'] %}<option {% if form_data.get('id_type[]', [''] * travellers)[i] == item %}selected{% endif %}>{{ item }}</option>{% endfor %}</select></div><div class="col-md-4"><label class="form-label">ID number</label><input class="form-control" name="id_number[]" value="{{ form_data.get('id_number[]', [''] * travellers)[i] }}" required></div><div class="col-md-6"><label class="form-label">Email</label><input class="form-control" name="email[]" type="email" value="{{ form_data.get('email[]', [''] * travellers)[i] }}" required></div><div class="col-md-6"><label class="form-label">Mobile</label><input class="form-control" name="mobile_number[]" value="{{ form_data.get('mobile_number[]', [''] * travellers)[i] }}" required></div></div>{% endfor %}<button class="btn btn-primary mt-4">Continue to demo payment</button></form></div></div></main></body></html>
