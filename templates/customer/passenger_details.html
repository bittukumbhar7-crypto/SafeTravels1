<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passenger Details | SafeTravels</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body>
    <header>
      <nav class="site-nav">
        <div class="container">
          <a class="brand" href="/">Safe<span>Travels</span> </a>
        </div>
      </nav>
    </header>
    <main class="container section-space pt-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <form class="content-card" action="/confirm_pay">
            <h1 class="section-title">Passenger details</h1>
            <p class="text-muted">
              Enter traveller information as it appears on a government ID.
            </p>
            <div class="row g-3">
              <div class="col-md-8">
                <label class="form-label">Passenger Name</label>
                <input class="form-control" name="passenger_name" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Age</label>
                <input class="form-control" name="age" type="number" required />
              </div>
              <div class="col-md-4">
                <label class="form-label">Gender</label>
                <select class="form-select" name="gender">
                  <option>Choose</option>
                  <option>Female</option>
                  <option>Male</option>
                  <option>Other</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">ID Type</label>
                <select class="form-select" name="id_type">
                  <option>Aadhaar Card</option>
                  <option>Passport</option>
                  <option>Driving License</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">ID Number</label>
                <input class="form-control" name="id_number" required />
              </div>
              <div class="col-md-6">
                <label class="form-label">Email</label>
                <input
                  class="form-control"
                  name="email"
                  type="email"
                  required
                />
              </div>
              <div class="col-md-6">
                <label class="form-label">Mobile Number</label>
                <input
                  class="form-control"
                  name="mobile_number"
                  type="tel"
                  required
                />
              </div>
            </div>
            <button class="btn btn-primary mt-4">Continue to Payment</button>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
