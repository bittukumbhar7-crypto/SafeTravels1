<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Boarding Pass | SafeTravels</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body>
    <header>
      <nav class="site-nav">
        <div class="container">
          <a class="brand" href="/">Safe<span>Travels</span> </a>
        </div>
      </nav>
    </header>
    <main class="container section-space pt-5">
      <div class="boarding-pass mx-auto" style="max-width: 850px">
        <div class="row g-0">
          <div class="col-md-8 boarding-main">
            <a class="brand" href="/">Safe<span>Travels</span> </a>
            <p class="text-muted">BOARDING PASS · DEMO</p>
            <div class="row my-4">
              <div class="col">
                <small class="text-muted">FROM</small>
                <h2>Mumbai</h2>
                <strong>BOM</strong>
              </div>
              <div class="col text-center pt-4">✈</div>
              <div class="col text-end">
                <small class="text-muted">TO</small>
                <h2>Delhi</h2>
                <strong>DEL</strong>
              </div>
            </div>
            <div class="row g-3">
              <div class="col-6 col-md-4">
                <small class="text-muted">PASSENGER</small>
                <strong class="d-block">Demo Passenger</strong>
              </div>
              <div class="col-6 col-md-4">
                <small class="text-muted">FLIGHT</small>
                <strong class="d-block">AI-123</strong>
              </div>
              <div class="col-6 col-md-4">
                <small class="text-muted">DATE</small>
                <strong class="d-block">15 OCT 2026</strong>
              </div>
              <div class="col-6 col-md-4">
                <small class="text-muted">BOARDING</small>
                <strong class="d-block">09:50 AM</strong>
              </div>
              <div class="col-6 col-md-4">
                <small class="text-muted">GATE</small>
                <strong class="d-block">B12</strong>
              </div>
              <div class="col-6 col-md-4">
                <small class="text-muted">SEAT</small>
                <strong class="d-block">3C</strong>
              </div>
            </div>
          </div>
          <div class="col-md-4 boarding-side">
            <p class="mb-4">SAFE TRAVELS</p>
            <small>PNR</small>
            <h3>ST8K2P</h3>
            <div class="barcode mt-5"></div>
            <small class="d-block mt-2">Barcode placeholder</small>
          </div>
        </div>
      </div>
      <p class="text-center text-muted mt-3">
        This is a static boarding-pass design, not valid for travel.
      </p>
    </main>
  </body>
</html>
