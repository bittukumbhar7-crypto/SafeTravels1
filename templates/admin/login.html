<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | SafeTravels</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
  </head>
  <body class="auth-page">
    <main class="container">
      <form
        class="auth-card"
        method="POST"
        action="{{ url_for('log') }}"
      >
        <a class="brand d-block text-center mb-4" href="{{ url_for('home') }}">
          Safe<span>Travels</span>
        </a>

        <h2 class="text-center h3">SafeTravels login</h2>
        <p class="text-muted text-center mb-4">Administrators are redirected automatically after login.</p>

        <label class="form-label">Email</label>
        <input class="form-control mb-3" type="email" name="txtemail" required />

        <label class="form-label">Password</label>
        <input
          class="form-control mb-4"
          type="password"
          name="txtpassword"
          required
        />

        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>
    </main>
  </body>
</html>
