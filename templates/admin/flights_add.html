<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Schedule Flight | SafeTravels Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
    <link rel="stylesheet" href="../../static/css/admin.css" />
  </head>
  <body class="admin-body">
    <nav class="site-nav admin-nav">
      <div class="container">
        <a class="brand" href="/dashboard"
          >Safe<span>Travels</span> Admin</a
        >
      </div>
    </nav>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-9">
          <form class="content-card" action="/flights">
            <h1 class="h2">Add / Schedule Flight</h1>
            <div class="row g-3 mt-2">
              <div class="col-md-6">
                <label class="form-label">Airline</label>
                <input class="form-control" name="airline" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Flight Number</label>
                <input class="form-control" name="flight_number" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Source</label>
                <input class="form-control" name="source_city" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Destination</label>
                <input class="form-control" name="destination_city" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Departure Date</label>
                <input class="form-control" type="date" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Departure Time</label>
                <input class="form-control" type="time" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Arrival Time</label>
                <input class="form-control" type="time" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Duration</label>
                <input class="form-control" placeholder="2h 15m" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Stops</label>
                <select class="form-select">
                  <option>Non-stop</option>
                  <option>1 Stop</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Aircraft</label>
                <select class="form-select">
                  <option>Airbus A320</option>
                </select>
              </div>
              <div class="col-md-4">
                <label class="form-label">Economy Fare</label>
                <input class="form-control" type="number" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Business Fare</label>
                <input class="form-control" type="number" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Available Seats</label>
                <input class="form-control" type="number" />
              </div>
            </div>
            <button class="btn btn-primary mt-4">Save Flight</button>
            <a class="btn btn-light mt-4 ms-2" href="flights.html">Cancel</a>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
