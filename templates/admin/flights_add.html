<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Flight | SafeTravels</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='css/admin.css')}}"></head><body class="admin-body"><nav class="site-nav admin-nav"><div class="container"><a class="brand" href="{{url_for('dash')}}">Safe<span>Travels</span> Admin</a></div></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-9"><form class="content-card" method="post" action="{{url_for('flight_edit',schedule_id=scheduled_flight.schedule_id) if scheduled_flight.get('schedule_id') else url_for('flight_add')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><h1 class="h2">{{'Edit' if scheduled_flight.get('schedule_id') else 'Schedule'}} flight</h1>{% with messages=get_flashed_messages(with_categories=true)%}{%for c,m in messages%}<div class="alert alert-{{c}}">{{m}}</div>{%endfor%}{%endwith%}<div class="row g-3 mt-2"><div class="col-md-6"><label class="form-label">Airline</label><input class="form-control" name="airline" value="{{scheduled_flight.get('airline','')}}" required></div><div class="col-md-6"><label class="form-label">Flight number</label><input class="form-control" name="flight_number" value="{{scheduled_flight.get('flight_number','')}}" required></div><div class="col-md-6"><label class="form-label">Origin code</label><input class="form-control" name="origin_code" maxlength="3" value="{{scheduled_flight.get('origin_code','')}}" required></div><div class="col-md-6"><label class="form-label">Destination code</label><input class="form-control" name="destination_code" maxlength="3" value="{{scheduled_flight.get('destination_code','')}}" required></div><div class="col-md-6"><label class="form-label">Departure</label><input class="form-control" type="datetime-local" name="departure_datetime" value="{{scheduled_flight.departure_datetime.strftime('%Y-%m-%dT%H:%M') if scheduled_flight.get('departure_datetime') else ''}}" required></div><div class="col-md-6"><label class="form-label">Arrival</label><input class="form-control" type="datetime-local" name="arrival_datetime" value="{{scheduled_flight.arrival_datetime.strftime('%Y-%m-%dT%H:%M') if scheduled_flight.get('arrival_datetime') else ''}}" required></div><div class="col-md-4"><label class="form-label">Duration (minutes)</label><input class="form-control" name="duration_minutes" type="number" min="1" value="{{scheduled_flight.get('duration_minutes','')}}" required></div><div class="col-md-4"><label class="form-label">Seat capacity</label><input class="form-control" name="seat_capacity" type="number" min="1" value="{{scheduled_flight.get('seat_capacity','')}}" required></div><div class="col-md-4"><label class="form-label">Fare</label><input class="form-control" name="fare" type="number" min="0" step="0.01" value="{{scheduled_flight.get('fare','')}}" required></div><div class="col-md-4"><label class="form-label">Class</label><select class="form-select" name="travel_class">{%for c in ['Economy','Business','First']%}<option {%if scheduled_flight.get('travel_class','Economy')==c%}selected{%endif%}>{{c}}</option>{%endfor%}</select></div><div class="col-md-4"><label class="form-label">Aircraft</label><select class="form-select" name="aircraft_id"><option value="">Unassigned</option>{%for a in aircraft%}<option value="{{a.aircraft_id}}" {%if scheduled_flight.get('aircraft_id')|string==a.aircraft_id|string%}selected{%endif%}>{{a.registration_number}} · {{a.model}}</option>{%endfor%}</select></div><div class="col-md-4"><label class="form-label">Status</label><select class="form-select" name="status">{%for s in ['Active','Inactive','Cancelled']%}<option {%if scheduled_flight.get('status','Active')==s%}selected{%endif%}>{{s}}</option>{%endfor%}</select></div></div><button class="btn btn-primary mt-4">Save flight</button><a class="btn btn-light mt-4 ms-2" href="{{url_for('flight')}}">Cancel</a></form></div></div></main></body></html>
