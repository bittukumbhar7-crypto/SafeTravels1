<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Aircraft | SafeTravels Admin</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../../static/css/style.css" />
    <link rel="stylesheet" href="../../static/css/admin.css" />
  </head>
  <body class="admin-body">
    <nav class="site-nav admin-nav">
      <div class="container">
        <a class="brand" href="dashboard.html"
          >Safe<span>Travels</span> Admin</a
        >
      </div>
    </nav>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-7">
          <form class="content-card" action="aircraft.html">
            <h1 class="h2">Edit Aircraft</h1>
            <p class="text-muted">Static form for future CRUD integration.</p>
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label">Aircraft Number</label>
                <input class="form-control" value="VT-STA" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Model</label>
                <input class="form-control" value="Airbus A320neo" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Total Seats</label>
                <input class="form-control" type="number" value="180" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Economy Seats</label>
                <input class="form-control" type="number" value="168" />
              </div>
              <div class="col-md-4">
                <label class="form-label">Business Seats</label>
                <input class="form-control" type="number" value="12" />
              </div>
              <div class="col-md-6">
                <label class="form-label">Status</label>
                <select class="form-select">
                  <option>Active</option>
                  <option>Maintenance</option>
                </select>
              </div>
            </div>
            <button class="btn btn-primary mt-4">Save Aircraft</button>
            <a class="btn btn-light mt-4 ms-2" href="aircraft.html">Cancel</a>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
