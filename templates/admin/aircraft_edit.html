<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aircraft | SafeTravels</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><link rel="stylesheet" href="{{url_for('static',filename='css/admin.css')}}"></head><body class="admin-body"><nav class="site-nav admin-nav"><div class="container"><a class="brand" href="{{url_for('dash')}}">Safe<span>Travels</span> Admin</a></div></nav><main class="container py-5"><div class="row justify-content-center"><div class="col-lg-7"><form class="content-card" method="post" action="{{url_for('aircraft_edit',aircraft_id=aircraft_record.aircraft_id) if aircraft_record.get('aircraft_id') else url_for('aircraft_add')}}"><input type="hidden" name="csrf_token" value="{{csrf_token()}}"><h1 class="h2">{{'Edit' if aircraft_record.get('aircraft_id') else 'Add'}} aircraft</h1>{%with messages=get_flashed_messages(with_categories=true)%}{%for c,m in messages%}<div class="alert alert-{{c}}">{{m}}</div>{%endfor%}{%endwith%}<div class="row g-3"><div class="col-md-6"><label class="form-label">Registration number</label><input class="form-control" name="registration_number" value="{{aircraft_record.get('registration_number','')}}" required></div><div class="col-md-6"><label class="form-label">Manufacturer</label><input class="form-control" name="manufacturer" value="{{aircraft_record.get('manufacturer','')}}" required></div><div class="col-12"><label class="form-label">Model</label><input class="form-control" name="model" value="{{aircraft_record.get('model','')}}" required></div><div class="col-md-3"><label class="form-label">Total seats</label><input class="form-control" type="number" name="total_capacity" min="1" value="{{aircraft_record.get('total_capacity','')}}" required></div><div class="col-md-3"><label class="form-label">Economy</label><input class="form-control" type="number" name="economy_capacity" min="0" value="{{aircraft_record.get('economy_capacity',0)}}" required></div><div class="col-md-3"><label class="form-label">Business</label><input class="form-control" type="number" name="business_capacity" min="0" value="{{aircraft_record.get('business_capacity',0)}}" required></div><div class="col-md-3"><label class="form-label">First</label><input class="form-control" type="number" name="first_capacity" min="0" value="{{aircraft_record.get('first_capacity',0)}}" required></div><div class="col-md-6"><label class="form-label">Status</label><select class="form-select" name="status">{%for s in ['Active','Inactive','Maintenance']%}<option {%if aircraft_record.get('status','Active')==s%}selected{%endif%}>{{s}}</option>{%endfor%}</select></div></div><button class="btn btn-primary mt-4">Save aircraft</button><a class="btn btn-light mt-4 ms-2" href="{{url_for('aircraft')}}">Cancel</a></form></div></div></main></body></html>
